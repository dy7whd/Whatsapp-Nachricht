<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body style="font-family: -apple-system, sans-serif; text-align: center; padding-top: 80px; background: #efeae2; margin: 0;">

    <div style="background: white; max-width: 320px; margin: auto; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
        <h2 style="color: #075e54; margin-top: 0;">WhatsApp</h2>
        <p id="status" style="color: #666; font-size: 14px; margin-bottom: 20px;">Tippe auf Verbinden, um Benachrichtigungen zu aktivieren:</p>
        <button id="connect-btn" style="background: #25d366; color: white; border: none; padding: 14px 24px; font-size: 16px; border-radius: 24px; font-weight: bold; cursor: pointer; width: 100%; box-shadow: 0 4px 10px rgba(37,211,102,0.3);">Verbinden</button>
    </div>

    <script>
        const ntfyTopic = "WhatsApp-Nachricht-David-777";

        document.getElementById('connect-btn').addEventListener('click', async () => {
            // 1. Service Worker registrieren
            if ('serviceWorker' in navigator) {
                try {
                    await navigator.serviceWorker.register('sw.js');
                } catch (e) {
                    console.log("SW Register Fehler:", e);
                }
            }

            // 2. Berechtigung abfragen
            const permission = await Notification.requestPermission();
            if (permission !== 'granted') {
                alert('Du musst Benachrichtigungen erlauben!');
                return;
            }

            document.getElementById('status').innerText = 'Verbunden & lauscht auf Nachrichten...';
            document.getElementById('connect-btn').style.background = '#128c7e';
            document.getElementById('connect-btn').innerText = 'Verbunden ✓';

            // 3. Direktverbindung zum SSE-Stream (ohne VAPID-Fehler)
            const eventSource = new EventSource(`https://ntfy.sh/${ntfyTopic}/sse`);

            eventSource.onmessage = function (event) {
                try {
                    const eventData = JSON.parse(event.data);
                    if (eventData.event === 'message') {
                        // Hier parsen wir den Nachrichtentext, falls er als JSON gesendet wurde
                        let messageBody = eventData.message || "Neue Nachricht";
                        let senderTitle = eventData.title || "WhatsApp";

                        // Falls der Nachrichtentext selbst ein JSON ist (wegen -d '{...}')
                        try {
                            const parsedBody = JSON.parse(eventData.message);
                            if (parsedBody.title) senderTitle = parsedBody.title;
                            if (parsedBody.message) messageBody = parsedBody.message;
                        } catch (e) {
                            // Wenn es normaler Text war, so lassen
                        }

                        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                            navigator.serviceWorker.ready.then(reg => {
                                reg.showNotification(senderTitle, {
                                    body: messageBody,
                                    icon: 'icon.png',
                                    badge: 'icon.png'
                                });
                            });
                        }
                    }
                } catch (e) {
                    console.error("Fehler beim Verarbeiten:", e);
                }
            };
                        } else {
                            new Notification(senderTitle, {
                                body: messageBody,
                                icon: 'icon.png'
                            });
                        }
                    }
                } catch (e) {
                    console.error("Fehler beim Verarbeiten:", e);
                }
            };

            alert('Erfolgreich verbunden!');
        });
    </script>
</body>
</html>
