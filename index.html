<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body style="font-family: -apple-system, sans-serif; text-align: center; padding-top: 80px; background: #efeae2; margin: 0;">

    <div style="background: white; max-width: 320px; margin: auto; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
        <h2 style="color: #075e54; margin-top: 0;">WhatsApp</h2>
        <p id="status" style="color: #666; font-size: 14px; margin-bottom: 20px;">Tippe auf Verbinden, um Push-Benachrichtigungen zu aktivieren:</p>
        <button id="connect-btn" style="background: #25d366; color: white; border: none; padding: 14px 24px; font-size: 16px; border-radius: 24px; font-weight: bold; cursor: pointer; width: 100%; box-shadow: 0 4px 10px rgba(37,211,102,0.3);">Verbinden</button>
    </div>

    <script>
        const ntfyTopic = "WhatsApp-Nachricht-David-777";

        document.getElementById('connect-btn').addEventListener('click', async () => {
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
                alert('Push wird von diesem Browser nicht unterstützt.');
                return;
            }

            const permission = await Notification.requestPermission();
            if (permission !== 'granted') {
                alert('Du musst Benachrichtigungen erlauben!');
                return;
            }

            try {
                const reg = await navigator.serviceWorker.register('sw.js');
                await navigator.serviceWorker.ready;

                const response = await fetch(`https://ntfy.sh/${ntfyTopic}/push/pubkey`);
                const vapidPublicKey = await response.text();
                
                // Saubere Bereinigung des Keys gegen ungültige Zeichen
                const cleanKey = vapidPublicKey.trim().replace(/(\r\n|\n|\r)/gm, "");
                const convertedKey = urlBase64ToUint8Array(cleanKey);

                const subscription = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: convertedKey
                });

                await fetch(`https://ntfy.sh/${ntfyTopic}/push/subscribe`, {
                    method: 'POST',
                    body: JSON.stringify(subscription)
                });

                document.getElementById('status').innerText = 'Verbunden & bereit!';
                document.getElementById('connect-btn').style.background = '#128c7e';
                document.getElementById('connect-btn').innerText = 'Verbunden ✓';
                alert('Erfolgreich verbunden!');
            } catch (err) {
                alert('Fehler: ' + err.message);
            }
        });

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }
    </script>
</body>
</html>
